<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Elysia Cloud</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;

        .card {

        h1 {
            font-size: 1.8rem;
            color: #58a6ff;
            margin: 0 0 12px 0;
            font-weight: 600;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0;
            color: #8b949e;
        }

</head>
<body>
    <div class="card">
        <h1>Elysia Cloud</h1>
        <p>Тут хранятся ресурспаки для Minecraft.</p>
